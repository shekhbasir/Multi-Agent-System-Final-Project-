<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">TalkSphere LearnGrid Logo</title>
  <desc id="desc">A blue education and communication logo with a graduation cap, global learning grid and speech bubbles.</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="55%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".18"/>
    </filter>
  </defs>

  <!-- Global learning sphere -->
  <circle cx="256" cy="304" r="139" fill="none" stroke="url(#blue)" stroke-width="14"/>
  <ellipse cx="256" cy="304" rx="65" ry="139" fill="none" stroke="url(#blue)" stroke-width="10"/>
  <ellipse cx="256" cy="304" rx="123" ry="48" fill="none" stroke="url(#blue)" stroke-width="10"/>
  <ellipse cx="256" cy="304" rx="128" ry="92" fill="none" stroke="url(#blue)" stroke-width="10"/>
  <path d="M117 304h278M137 256h238M137 352h238" fill="none" stroke="url(#blue)" stroke-width="9" stroke-linecap="round"/>

  <!-- Graduation cap -->
  <g filter="url(#shadow)">
    <path d="M91 161L256 91l165 70-165 71z" fill="url(#cap)"/>
    <path d="M145 190v55c0 24 48 45 111 45s111-21 111-45v-55l-111 47z" fill="#2563EB"/>
    <path d="M421 161v70" stroke="#1E40AF" stroke-width="10" stroke-linecap="round"/>
    <circle cx="421" cy="239" r="11" fill="#1E40AF"/>
    <path d="M421 249l-15 47h30z" fill="#1E40AF"/>
  </g>

  <!-- Left speech bubble -->
  <g filter="url(#shadow)">
    <path d="M79 271c0-34 30-58 70-58h54c40 0 70 24 70 58s-30 58-70 58h-35l-32 27 8-31c-39-7-65-28-65-54z" fill="white" stroke="#2563EB" stroke-width="9"/>
    <circle cx="140" cy="271" r="8" fill="#2563EB"/>
    <circle cx="167" cy="271" r="8" fill="#0EA5E9"/>
    <circle cx="194" cy="271" r="8" fill="#38BDF8"/>
  </g>

  <!-- Right speech bubble -->
  <g filter="url(#shadow)">
    <path d="M287 309c0-31 27-54 64-54h67c37 0 65 23 65 54s-28 54-65 54h-37l-34 27 8-30c-40-6-68-25-68-51z" fill="white" stroke="#0EA5E9" stroke-width="9"/>
    <path d="M335 309h78" stroke="#2563EB" stroke-width="9" stroke-linecap="round"/>
    <path d="M335 332h51" stroke="#38BDF8" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- Small connection nodes -->
  <circle cx="103" cy="382" r="7" fill="#2563EB"/>
  <circle cx="409" cy="390" r="7" fill="#0EA5E9"/>
  <path d="M103 382l38-28M409 390l-37-30" stroke="#60A5FA" stroke-width="5" stroke-linecap="round"/>

  <!-- Brand -->
  <text x="256" y="482" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" fill="#0F172A" letter-spacing="2">TALKSPHERE</text>
  <text x="256" y="507" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#2563EB" letter-spacing="5">LEARNGRID</text>
</svg>